<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="100%" height="100%">
  <!-- BACKGROUND SHADOW SILHOUETTE (for solid rendering) -->
  <g id="volt-character">
    <!-- TORSO & SHOULDERS BASE SILHOUETTE -->
    <!-- SLACKS / WAIST -->
    <path d="M52 248 L148 248 L152 280 L48 280 Z" fill="#1A1F2E" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    <path d="M52 248 L100 252 L148 248 L146 262 L100 266 L54 262 Z" fill="#2A3142" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Belt Buckle -->
    <rect x="92" y="252" width="16" height="11" fill="#3A4156" stroke="#1A1F2E" stroke-width="1.8" />

    <!-- SHIRT / UNDERSHIRT UNDER VEST -->
    <path d="M38 108 L162 108 L170 180 L156 248 L44 248 L30 180 Z" fill="#2A3142" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    <!-- Shirt Right Shadow -->
    <path d="M125 110 L162 108 L170 180 L156 248 L138 248 L146 175 Z" fill="#1A1F2E" />

    <!-- ARMS (Upper sleeves) -->
    <!-- Left Upper Arm -->
    <path d="M38 108 L18 162 L42 178 L54 135 Z" fill="#2A3142" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    <path d="M22 152 L18 162 L42 178 L45 168 Z" fill="#1A1F2E" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Right Upper Arm -->
    <path d="M162 108 L182 162 L158 178 L146 135 Z" fill="#1A1F2E" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    <path d="M162 108 L174 138 L154 148 L150 120 Z" fill="#2A3142" />

    <!-- VEST (Amber Hero Color) -->
    <!-- Vest Back / Base -->
    <path d="M56 100 L76 102 L86 142 L114 142 L124 102 L144 100 L160 175 L150 248 L50 248 L40 175 Z" fill="#F0A500" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Vest Hard Shadow Planes -->
    <!-- Underside shadow -->
    <path d="M50 236 L150 236 L148 248 L52 248 Z" fill="#C17F24" />
    <!-- Right side cast shadow -->
    <path d="M124 102 L144 100 L160 175 L150 248 L134 248 L144 178 L126 142 Z" fill="#C17F24" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Deep Crease Shadows on Vest -->
    <polygon points="60,170 78,195 62,215 54,185" fill="#C17F24" />
    <polygon points="122,175 140,205 132,230 118,190" fill="#C17F24" />

    <!-- Vest Highlight Planes -->
    <polygon points="58,102 74,104 70,125 56,120" fill="#FFD166" />
    <path d="M42 160 L50 118 L58 120 L48 165 Z" fill="#FFD166" />

    <!-- Vest Flaps & Collar -->
    <!-- Left Collar -->
    <path d="M72 102 L90 148 L68 142 L58 104 Z" fill="#F0A500" stroke="#1A1F2E" stroke-width="1.8" />
    <polygon points="72,102 78,135 68,142 58,104" fill="#FFD166" />
    <!-- Right Collar -->
    <path d="M128 102 L110 148 L132 142 L142 104 Z" fill="#C17F24" stroke="#1A1F2E" stroke-width="1.8" />
    
    <!-- Center Zipper / Seam Line -->
    <line x1="100" y1="145" x2="100" y2="246" stroke="#1A1F2E" stroke-width="2.5" />
    <!-- Utility Chest Pocket (Left) -->
    <rect x="58" y="152" width="26" height="24" fill="#F0A500" stroke="#1A1F2E" stroke-width="1.8" />
    <path d="M56 150 L86 150 L84 158 L58 158 Z" fill="#FFD166" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Utility Radio Pocket (Right) -->
    <rect x="116" y="152" width="24" height="28" fill="#C17F24" stroke="#1A1F2E" stroke-width="1.8" />
    <path d="M114 150 L142 150 L140 157 L116 157 Z" fill="#F0A500" stroke="#1A1F2E" stroke-width="1.8" />

    <!-- NECK & HEAD -->
    <!-- Neck Base -->
    <path d="M80 78 L120 78 L126 112 L74 112 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Neck Hard Shadow (Under Jaw) -->
    <polygon points="78,78 122,78 126,98 104,106 82,96" fill="#8B5E3C" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Sternocleidomastoid shadow lines -->
    <line x1="88" y1="92" x2="94" y2="110" stroke="#8B5E3C" stroke-width="2" />
    <line x1="112" y1="92" x2="106" y2="110" stroke="#8B5E3C" stroke-width="2" />

    <!-- EARS -->
    <!-- Left Ear -->
    <path d="M68 50 L64 64 L72 68 L74 54 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2" />
    <polygon points="68,54 66,62 70,64" fill="#8B5E3C" />
    <!-- Right Ear -->
    <path d="M132 50 L136 64 L128 68 L126 54 Z" fill="#8B5E3C" stroke="#1A1F2E" stroke-width="2" />

    <!-- HEAD & JAW (Square, strong, GTA comic art style) -->
    <path d="M72 44 L128 44 L128 66 L118 84 L82 84 L72 66 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Face Shadow Planes (Right side shadow & under-chin) -->
    <polygon points="106,44 128,44 128,66 118,84 104,84 116,68" fill="#8B5E3C" />
    <polygon points="82,80 118,80 116,84 84,84" fill="#8B5E3C" />
    <!-- Cheekbone Highlight (Left) -->
    <polygon points="74,56 86,52 82,64 74,66" fill="#D4A574" />
    <!-- Forehead Highlight -->
    <polygon points="80,44 104,44 98,50 82,50" fill="#D4A574" />

    <!-- NOSE -->
    <polygon points="98,50 104,66 94,68 96,50" fill="#C4956A" />
    <!-- Nose Shadow Plane -->
    <polygon points="100,50 104,66 98,68" fill="#8B5E3C" stroke="#1A1F2E" stroke-width="1.8" />
    <line x1="94" y1="68" x2="104" y2="68" stroke="#1A1F2E" stroke-width="2" />

    <!-- EYES & BROWS (Stern, intense, furrowed) -->
    <!-- Furrow creases -->
    <line x1="97" y1="46" x2="97" y2="52" stroke="#1A1F2E" stroke-width="1.8" />
    <line x1="103" y1="46" x2="103" y2="52" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Left Brow -->
    <polygon points="76,46 94,50 92,53 78,50" fill="#1A1F2E" />
    <!-- Right Brow -->
    <polygon points="106,50 124,46 122,50 108,53" fill="#1A1F2E" />
    <!-- Eyes -->
    <path d="M80 54 L88 53 L90 57 L82 58 Z" fill="#E8E0D0" stroke="#1A1F2E" stroke-width="1.5" />
    <rect x="84" y="54" width="3.5" height="3.5" fill="#2A1F0E" />
    <path d="M110 53 L118 54 L116 58 L108 57 Z" fill="#E8E0D0" stroke="#1A1F2E" stroke-width="1.5" />
    <rect x="111" y="54" width="3.5" height="3.5" fill="#2A1F0E" />

    <!-- MOUTH & STUBBLE / EXPRESSION -->
    <!-- Upper lip shadow -->
    <line x1="88" y1="74" x2="112" y2="74" stroke="#1A1F2E" stroke-width="2" />
    <!-- Under lower lip shadow polygon -->
    <polygon points="94,76 106,76 102,80 96,80" fill="#8B5E3C" stroke="#1A1F2E" stroke-width="1.5" />

    <!-- HAIR (Receding hairline, brushed back at temples, dark brown/black) -->
    <path d="M68 46 C66 32 76 18 100 18 C124 18 134 32 132 46 L128 44 C126 34 118 28 100 28 C82 28 74 34 72 44 Z" fill="#2A1F0E" stroke="#1A1F2E" stroke-width="3" stroke-linejoin="round" />
    <!-- Hair Volume Top & Temples -->
    <path d="M72 44 C76 34 86 28 100 28 C116 28 124 34 128 44 L126 36 L120 24 L100 22 L80 24 L74 36 Z" fill="#2A1F0E" />
    <!-- Hair Shadow (Right & Back) -->
    <path d="M100 22 L120 24 L126 36 L128 44 L118 42 L112 30 L100 28 Z" fill="#1A0F00" stroke="#1A1F2E" stroke-width="1.8" />
    <!-- Hair Strands / Inked Details -->
    <path d="M84 26 L92 34 M96 24 L102 32 M108 26 L114 34" stroke="#1A1F2E" stroke-width="1.8" stroke-linecap="round" />

    <!-- FOREARMS & HANDS HOLDING INDUSTRIAL POWER ANALYZER -->
    <!-- Left Forearm (Folded Forward) -->
    <path d="M38 172 L58 206 L84 200 L68 165 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="42,176 56,202 52,204 38,182" fill="#8B5E3C" />
    <!-- Left Hand -->
    <path d="M78 198 L94 196 L98 214 L82 218 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2.5" />
    <!-- Fingers gripping analyzer -->
    <rect x="88" y="196" width="6" height="18" rx="2" fill="#D4A574" stroke="#1A1F2E" stroke-width="1.8" />
    <rect x="94" y="197" width="6" height="17" rx="2" fill="#C4956A" stroke="#1A1F2E" stroke-width="1.8" />

    <!-- Right Forearm (Folded Across) -->
    <path d="M162 172 L142 206 L116 200 L132 165 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="158,176 144,202 148,204 162,182" fill="#8B5E3C" />
    <!-- Right Hand -->
    <path d="M122 198 L106 196 L102 214 L118 218 Z" fill="#C4956A" stroke="#1A1F2E" stroke-width="2.5" />
    <rect x="106" y="196" width="6" height="18" rx="2" fill="#8B5E3C" stroke="#1A1F2E" stroke-width="1.8" />
    <rect x="100" y="197" width="6" height="17" rx="2" fill="#C4956A" stroke="#1A1F2E" stroke-width="1.8" />

    <!-- INDUSTRIAL POWER ANALYZER UNIT IN HANDS -->
    <rect x="84" y="192" width="32" height="46" rx="3" fill="#252B3B" stroke="#1A1F2E" stroke-width="2.5" />
    <!-- Device Screen (Telemetry Grid) -->
    <rect x="88" y="198" width="24" height="18" fill="#1A1F2E" stroke="#3A4156" stroke-width="1.5" />
    <!-- Active Amber Waveform on Screen -->
    <path d="M90 207 L94 207 L96 202 L98 211 L102 204 L104 207 L110 207" fill="none" stroke="#F0A500" stroke-width="1.8" />
    <!-- Knobs and Port jacks -->
    <circle cx="93" cy="225" r="3" fill="#F0A500" stroke="#1A1F2E" stroke-width="1.5" />
    <circle cx="107" cy="225" r="3" fill="#3A4156" stroke="#1A1F2E" stroke-width="1.5" />
    <!-- Coiled Cable hanging down from analyzer -->
    <path d="M100 238 C94 246, 106 254, 100 262 C96 268, 104 274, 98 280" fill="none" stroke="#1A1F2E" stroke-width="2.5" />
  </g>
</svg>
